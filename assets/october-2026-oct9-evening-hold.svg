<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc"><title id="title">October hold readings, October 9 midday and evening</title><desc id="desc">Kalshi maintain-rate Chance heading fell from 85% to 83%. Polymarket No change fell from 85% to 84%. Direct page access times are not quote times.</desc><rect width="760" height="250" fill="#f4f8fc"/><text x="24" y="32" font-family="Arial" font-size="20" font-weight="700" fill="#13243a">October hold readings</text><text x="24" y="54" font-family="Arial" font-size="13" fill="#53677f">Direct event pages · Oct 9, 13:33 → 19:05 UTC</text><text x="24" y="91" font-family="Arial" font-size="16" fill="#13243a">Kalshi · maintain rate</text><rect x="260" y="77" width="340" height="20" rx="4" fill="#9ec3e6"/><rect x="260" y="102" width="332" height="20" rx="4" fill="#1557aa"/><text x="610" y="94" font-family="Arial" font-size="16" fill="#13243a">85%</text><text x="610" y="119" font-family="Arial" font-size="16" font-weight="700" fill="#13243a">83%</text><text x="24" y="164" font-family="Arial" font-size="16" fill="#13243a">Polymarket · no change</text><rect x="260" y="150" width="340" height="20" rx="4" fill="#9ec3e6"/><rect x="260" y="175" width="336" height="20" rx="4" fill="#1557aa"/><text x="610" y="167" font-family="Arial" font-size="16" fill="#13243a">85%</text><text x="610" y="192" font-family="Arial" font-size="16" font-weight="700" fill="#13243a">84%</text><text x="24" y="226" font-family="Arial" font-size="13" fill="#53677f">Lighter: midday · Darker: evening · Rounded displayed rows, not pooled odds.</text></svg>