<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">October hold display comparison</title><desc id="desc">Kalshi maintain Chance heading 94% on October 27 evening and October 28 midday. Polymarket no-change named row 95% then 93%. Separate page observations, not synchronized quotes.</desc><rect width="720" height="300" fill="#f3f7fb"/><text x="28" y="35" font-family="Arial" font-size="23" font-weight="bold" fill="#13243a">October hold displays</text><text x="28" y="62" font-family="Arial" font-size="14" fill="#53677f">Direct page observations · not venue quote times</text><text x="28" y="103" font-family="Arial" font-size="16" fill="#13243a">Kalshi maintains rate · Chance heading</text><rect x="290" y="82" width="300" height="28" fill="#bad4f5"/><text x="608" y="103" font-family="Arial" font-size="17" fill="#13243a">94% → 94%</text><text x="28" y="159" font-family="Arial" font-size="16" fill="#13243a">Polymarket no change · named row</text><rect x="290" y="138" width="303" height="28" fill="#8ebfa8"/><rect x="290" y="172" width="297" height="28" fill="#378861"/><text x="608" y="159" font-family="Arial" font-size="17" fill="#13243a">95%</text><text x="608" y="193" font-family="Arial" font-size="17" fill="#13243a">93%</text><text x="28" y="244" font-family="Arial" font-size="13" fill="#53677f">October 27, 19:02 UTC → October 28, about 13:35 UTC</text><text x="28" y="267" font-family="Arial" font-size="12" fill="#53677f">Sources: Kalshi October KXFEDDECISION-26OCT; Polymarket October event. Checked October 28, 2026.</text></svg>
