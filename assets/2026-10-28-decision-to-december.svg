<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="title desc"><title id="title">Fed October result and December contract snapshot, October 28, 2026</title><desc id="desc">The Federal Reserve held its target range at 3.75 to 4.00 percent on October 28. At about 19:05 UTC, Kalshi and Polymarket December 25-basis-point-hike displays showed 81 and 82 percent respectively; access times are not quote times.</desc><rect width="760" height="210" fill="#f4f7fb"/><text x="24" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#13243a">Decision → next meeting</text><rect x="24" y="58" width="330" height="116" rx="9" fill="#e0ebf6"/><text x="40" y="84" font-family="Arial" font-size="15" fill="#243f5b">OCT 28 · FOMC STATEMENT</text><text x="40" y="124" font-family="Arial" font-size="29" font-weight="bold" fill="#13243a">Hold 3.75%–4.00%</text><text x="40" y="151" font-family="Arial" font-size="15" fill="#243f5b">10–2 vote</text><path d="M369 116h38m-10-10 10 10-10 10" stroke="#1c5e9c" stroke-width="4" fill="none"/><rect x="422" y="58" width="314" height="116" rx="9" fill="#dbeee8"/><text x="438" y="84" font-family="Arial" font-size="15" fill="#205544">DEC 8–9 · NEXT MEETING</text><text x="438" y="116" font-family="Arial" font-size="19" font-weight="bold" fill="#123f33">25 bp hike: 81% Kalshi</text><text x="438" y="144" font-family="Arial" font-size="19" font-weight="bold" fill="#123f33">82% Polymarket</text><text x="24" y="197" font-family="Arial" font-size="12" fill="#49647b">Sources: Federal Reserve statement; Kalshi and Polymarket December pages, accessed Oct 28 about 19:05 UTC.</text></svg>
