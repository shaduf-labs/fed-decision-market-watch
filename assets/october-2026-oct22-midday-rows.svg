<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" role="img" aria-labelledby="t d"><title id="t">October hold rows on two page checks</title><desc id="d">Kalshi maintain-rate Chance heading rose from 88% on October 21 at 19:05 UTC to 89% on October 22 at 13:34 UTC. Polymarket no-change named row rose from 87% to 91%. Page access times are not venue quote times.</desc><rect width="760" height="306" fill="#f6f9fc"/><text x="28" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#142b43">Hold remains the leading outcome</text><text x="28" y="63" font-family="Arial" font-size="14" fill="#53677f">Named page rows · access times, not quote times</text><text x="28" y="108" font-family="Arial" font-size="17" fill="#142b43">Kalshi · maintains rate</text><rect x="252" y="87" width="352" height="16" rx="3" fill="#bdcee4"/><rect x="252" y="113" width="356" height="16" rx="3" fill="#1762a6"/><text x="622" y="101" font-family="Arial" font-size="16" fill="#142b43">88%</text><text x="622" y="127" font-family="Arial" font-size="16" fill="#142b43">89%</text><text x="28" y="189" font-family="Arial" font-size="17" fill="#142b43">Polymarket · no change</text><rect x="252" y="168" width="348" height="16" rx="3" fill="#bdcee4"/><rect x="252" y="194" width="364" height="16" rx="3" fill="#1762a6"/><text x="622" y="182" font-family="Arial" font-size="16" fill="#142b43">87%</text><text x="622" y="208" font-family="Arial" font-size="16" fill="#142b43">91%</text><rect x="28" y="235" width="17" height="13" fill="#bdcee4"/><text x="54" y="247" font-family="Arial" font-size="13" fill="#142b43">Oct 21 · 19:05 UTC</text><rect x="270" y="235" width="17" height="13" fill="#1762a6"/><text x="296" y="247" font-family="Arial" font-size="13" fill="#142b43">Oct 22 · 13:34 UTC</text><text x="28" y="283" font-family="Arial" font-size="12" fill="#53677f">Sources: direct Kalshi and Polymarket event pages · 2026. Separate rounded displays.</text></svg>
