<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc"><title id="title">October 20 hold displays at two page checks</title><desc id="desc">Kalshi maintain-rate Chance heading 87% then 88%; Polymarket no-change named row 87% then 86%, checked at about 13:35 and 19:07 UTC. Page access is not venue quote time.</desc><rect width="920" height="360" fill="#f6f9fc"/><text x="36" y="45" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13243a">October hold rows: a small venue split</text><text x="36" y="77" font-family="Arial,sans-serif" font-size="15" fill="#425873">October 20, 2026 · direct page access, not venue quote time</text><text x="36" y="125" font-family="Arial,sans-serif" font-size="18" fill="#13243a">Kalshi Chance · maintains rate</text><text x="600" y="125" font-family="Arial,sans-serif" font-size="18" fill="#13243a">87% → 88%</text><rect x="36" y="140" width="660" height="26" rx="4" fill="#dce5ef"/><rect x="36" y="140" width="581" height="26" rx="4" fill="#19828c"/><text x="36" y="205" font-family="Arial,sans-serif" font-size="18" fill="#13243a">Polymarket named row · no change</text><text x="600" y="205" font-family="Arial,sans-serif" font-size="18" fill="#13243a">87% → 86%</text><rect x="36" y="220" width="660" height="26" rx="4" fill="#dce5ef"/><rect x="36" y="220" width="568" height="26" rx="4" fill="#3259a7"/><text x="36" y="289" font-family="Arial,sans-serif" font-size="15" fill="#425873">Comparison: about 13:35 UTC → about 19:07 UTC. Separate rounded displays.</text><text x="36" y="320" font-family="Arial,sans-serif" font-size="14" fill="#425873">Sources: Kalshi October event; Polymarket October event. Accessed October 20, 2026.</text></svg>