<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 310" aria-labelledby="title desc"><title id="title">October 19 hold check, Kalshi and Polymarket</title><desc id="desc">Kalshi Chance headings and Polymarket named rows from page checks at October 18 19:04 UTC and October 19 13:33 UTC. Kalshi hold 87 to 86 percent, hike 12 to 13. Polymarket hold 87 to 86, hike 14 to 14. These are page access times, not quote times.</desc><rect width="760" height="310" rx="16" fill="#f3f7fb"/><text x="28" y="39" font-family="Arial" font-size="23" font-weight="bold" fill="#14243a">Hold stays ahead; both hold rows −1 point</text><text x="28" y="65" font-family="Arial" font-size="14" fill="#425b76">Separate event pages · October 18 and 19, 2026</text><text x="365" y="98" font-family="Arial" font-size="14" fill="#425b76">Oct 18 · 19:04 UTC</text><text x="575" y="98" font-family="Arial" font-size="14" fill="#425b76">Oct 19 · 13:33 UTC</text><line x1="28" y1="109" x2="730" y2="109" stroke="#b9cddd"/><text x="28" y="143" font-family="Arial" font-size="17" fill="#14243a">Kalshi · maintain</text><text x="385" y="143" font-family="Arial" font-size="20" fill="#1557aa">87%</text><text x="598" y="143" font-family="Arial" font-size="20" font-weight="bold" fill="#1557aa">86%</text><text x="28" y="181" font-family="Arial" font-size="17" fill="#14243a">Kalshi · hike 25 bp</text><text x="385" y="181" font-family="Arial" font-size="20" fill="#a04f1c">12%</text><text x="598" y="181" font-family="Arial" font-size="20" font-weight="bold" fill="#a04f1c">13%</text><text x="28" y="219" font-family="Arial" font-size="17" fill="#14243a">Polymarket · no change</text><text x="385" y="219" font-family="Arial" font-size="20" fill="#1557aa">87%</text><text x="598" y="219" font-family="Arial" font-size="20" font-weight="bold" fill="#1557aa">86%</text><text x="28" y="257" font-family="Arial" font-size="17" fill="#14243a">Polymarket · hike 25 bp</text><text x="385" y="257" font-family="Arial" font-size="20" fill="#a04f1c">14%</text><text x="598" y="257" font-family="Arial" font-size="20" font-weight="bold" fill="#a04f1c">14%</text><text x="28" y="290" font-family="Arial" font-size="13" fill="#425b76">Sources: Kalshi October Chance headings; Polymarket October named rows. Access ≠ quote time.</text></svg>