<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" role="img" aria-labelledby="title desc"><title id="title">October Fed hold rows rose to 75% on both venues, October 1, 2026</title><desc id="desc">Direct page checks at 13:36 and about 19:03 UTC on October 1. Kalshi Fed maintains rate rose 65 to 75 percent and Hike 25bps fell 35 to 25 percent. Polymarket No change rose 64 to 75 percent and 25 bps increase fell 36 to 25 percent. Access times are not quote times.</desc><rect width="900" height="365" fill="#f6f9fc"/><style>text{font:16px Arial,sans-serif;fill:#15293e}.title{font-size:23px;font-weight:bold}.small{font-size:13px;fill:#42566c}.label{font-size:16px;font-weight:bold}</style><text x="24" y="39" class="title">October hold rows reach 75% at both venues</text><text x="24" y="65" class="small">Direct named rows · October 1, 2026 · 13:36 → about 19:03 UTC</text><text x="24" y="103" class="label">Kalshi · Fed maintains rate</text><rect x="300" y="87" width="325" height="18" fill="#9ac6dd"/><rect x="300" y="111" width="375" height="18" fill="#176d91"/><text x="690" y="126">65% → 75%</text><text x="24" y="165" class="label">Kalshi · Hike 25bps</text><rect x="300" y="149" width="175" height="18" fill="#e6bea1"/><rect x="300" y="173" width="125" height="18" fill="#a4512d"/><text x="690" y="188">35% → 25%</text><text x="24" y="227" class="label">Polymarket · No change</text><rect x="300" y="211" width="320" height="18" fill="#9ac6dd"/><rect x="300" y="235" width="375" height="18" fill="#176d91"/><text x="690" y="250">64% → 75%</text><text x="24" y="289" class="label">Polymarket · 25 bps increase</text><rect x="300" y="273" width="180" height="18" fill="#e6bea1"/><rect x="300" y="297" width="125" height="18" fill="#a4512d"/><text x="690" y="312">36% → 25%</text><text x="24" y="347" class="small">Light: 13:36 UTC · dark: about 19:03 UTC. Source: direct Kalshi and Polymarket October event pages.</text></svg>