<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img" aria-labelledby="t d"><title id="t">October hold rows at October 7 evening and October 8 midday page checks</title><desc id="d">Kalshi maintain-rate Chance heading moved from 83% to 82%. Polymarket No change named row stayed at 84%. Separate rounded displays, access times not quote times.</desc><rect width="760" height="282" fill="#f5f8fc"/><text x="25" y="37" fill="#13243a" font-family="Arial" font-size="22" font-weight="700">October hold: little changed</text><text x="25" y="67" fill="#52657c" font-family="Arial" font-size="14">Direct event-page checks · Oct 7, 19:06 → Oct 8, 13:35 UTC</text><text x="25" y="112" fill="#13243a" font-family="Arial" font-size="18">Kalshi · maintains rate</text><rect x="300" y="91" width="332" height="22" rx="4" fill="#c5d4e7"/><rect x="300" y="120" width="328" height="22" rx="4" fill="#1557aa"/><text x="642" y="109" fill="#13243a" font-family="Arial" font-size="16">83%</text><text x="638" y="138" fill="#13243a" font-family="Arial" font-size="16">82%</text><text x="25" y="191" fill="#13243a" font-family="Arial" font-size="18">Polymarket · No change</text><rect x="300" y="168" width="336" height="22" rx="4" fill="#c5d4e7"/><rect x="300" y="197" width="336" height="22" rx="4" fill="#1557aa"/><text x="646" y="186" fill="#13243a" font-family="Arial" font-size="16">84%</text><text x="646" y="215" fill="#13243a" font-family="Arial" font-size="16">84%</text><rect x="25" y="242" width="15" height="15" fill="#c5d4e7"/><text x="47" y="255" fill="#52657c" font-family="Arial" font-size="13">Oct 7</text><rect x="120" y="242" width="15" height="15" fill="#1557aa"/><text x="142" y="255" fill="#52657c" font-family="Arial" font-size="13">Oct 8</text><text x="290" y="255" fill="#52657c" font-family="Arial" font-size="13">Different contracts; access is not quote time.</text></svg>