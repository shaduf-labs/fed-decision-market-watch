<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">December 25-basis-point-hike displays at two October 29 page checks</title><desc id="desc">Kalshi Chance heading was 80% at 13:34 UTC and 77% at 19:06 UTC; Polymarket named row was 78% then 77%. Access times are not quote times.</desc><rect width="960" height="410" fill="#f5f8fc"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#13243a">December hike: two page checks</text><text x="40" y="77" font-family="Arial,sans-serif" font-size="16" fill="#475a70">Named 25-basis-point outcomes · access time, not quote time</text><text x="40" y="135" font-family="Arial,sans-serif" font-size="18" fill="#13243a">Kalshi Chance heading</text><rect x="300" y="112" width="480" height="32" fill="#6386ad"/><text x="800" y="137" font-family="Arial,sans-serif" font-size="18" fill="#13243a">80% · 13:34</text><rect x="300" y="155" width="462" height="32" fill="#1557aa"/><text x="800" y="180" font-family="Arial,sans-serif" font-size="18" fill="#13243a">77% · 19:06</text><text x="40" y="247" font-family="Arial,sans-serif" font-size="18" fill="#13243a">Polymarket named row</text><rect x="300" y="225" width="468" height="32" fill="#6386ad"/><text x="800" y="250" font-family="Arial,sans-serif" font-size="18" fill="#13243a">78% · 13:34</text><rect x="300" y="268" width="462" height="32" fill="#1557aa"/><text x="800" y="293" font-family="Arial,sans-serif" font-size="18" fill="#13243a">77% · 19:06</text><text x="40" y="350" font-family="Arial,sans-serif" font-size="15" fill="#475a70">Sources: Kalshi KXFEDDECISION-26DEC and Polymarket December event pages.</text><text x="40" y="377" font-family="Arial,sans-serif" font-size="15" fill="#475a70">Accessed Oct 29, 2026, UTC. Different rules; no native quote-time or causal inference.</text></svg>