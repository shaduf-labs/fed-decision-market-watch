  <text x="724" y="167" fill="#aebed4" font-family="Arial, sans-serif" font-size="14">Source: Kalshi</text>
  <text x="92" y="276" fill="#dbe6f4" font-family="Arial, sans-serif" font-size="17" font-weight="700">Polymarket September event page · “25 bps increase”</text>
