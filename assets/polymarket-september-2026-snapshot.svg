  <text x="44" y="77" fill="#aebed4" font-family="Arial, sans-serif" font-size="15">September FOMC event contracts · accessed Sep. 16, 2026, 13:39 UTC · not a consensus</text>
  <text x="92" y="118" fill="#dbe6f4" font-family="Arial, sans-serif" font-size="17" font-weight="700">Kalshi September event page · “Hike 25bps”</text>
  <rect x="92" y="138" width="616" height="42" fill="#c46345" rx="8"/>
