<svg xmlns="http://www.w3.org/2000/svg" width="920" height="412" viewBox="0 0 920 412" role="img" aria-labelledby="title desc">
  <title id="title">Direct September 2026 Fed-decision event-contract snapshot</title>
  <desc id="desc">Direct Kalshi and Polymarket September 2026 event pages were accessed on September 16, 2026, at 13:39 UTC. Each displayed 88 percent for its named 25 basis point increase outcome and 12 percent for its named hold or no-change outcome. The readings are separate contracts, not a consensus.</desc>
