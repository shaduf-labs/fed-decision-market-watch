<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="t d"><title id="t">October Fed hold rows, October 3–4, 2026</title><desc id="d">Kalshi Chance heading: 84% then 82%. Polymarket No change row: 83% at both page accesses. Sources: direct Kalshi and Polymarket pages. Access is not quote time.</desc><rect width="820" height="320" rx="16" fill="#f4f7fb"/><text x="35" y="45" font-family="Arial" font-size="23" font-weight="700" fill="#13243a">October hold rows: small weekend change</text><text x="35" y="74" font-family="Arial" font-size="15" fill="#53677f">Direct event pages · accessed Oct 3, 19:03 UTC and Oct 4, 13:33 UTC</text><text x="35" y="126" font-family="Arial" font-size="17" fill="#13243a">Kalshi · Fed maintains rate</text><rect x="330" y="107" width="336" height="24" fill="#80a8da"/><rect x="330" y="139" width="328" height="24" fill="#1557aa"/><text x="680" y="126" font-family="Arial" font-size="16" fill="#13243a">84%</text><text x="672" y="158" font-family="Arial" font-size="16" fill="#13243a">82%</text><text x="35" y="215" font-family="Arial" font-size="17" fill="#13243a">Polymarket · No change</text><rect x="330" y="196" width="332" height="24" fill="#8dcac0"/><rect x="330" y="228" width="332" height="24" fill="#138677"/><text x="676" y="215" font-family="Arial" font-size="16" fill="#13243a">83%</text><text x="676" y="247" font-family="Arial" font-size="16" fill="#13243a">83%</text><text x="35" y="290" font-family="Arial" font-size="13" fill="#53677f">Top bar: Oct 3; bottom bar: Oct 4. Access time ≠ quote time. Venues are separate.</text></svg>
