<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d"><title id="t">October hold rows, two page checks</title><desc id="d">Kalshi maintain: 93 percent on October 24 and 93 percent on October 27. Polymarket no change: 95 percent on October 24 and 94 percent on October 27. Access times, not venue quote times.</desc><rect width="800" height="300" fill="#f5f8fc"/><text x="30" y="38" font-size="24" font-family="Arial" fill="#13243a">Hold still leads before the decision</text><text x="30" y="63" font-size="14" font-family="Arial" fill="#53677f">Separate venue rows · page checks Oct 24, 19:04 UTC and Oct 27, 09:43 UTC</text><text x="30" y="110" font-size="18" font-family="Arial" fill="#13243a">Kalshi maintain</text><rect x="260" y="88" width="372" height="30" fill="#96b6dc"/><rect x="260" y="122" width="372" height="30" fill="#1557aa"/><text x="645" y="111" font-size="18" font-family="Arial">93% · Oct 24</text><text x="645" y="145" font-size="18" font-family="Arial">93% · Oct 27</text><text x="30" y="205" font-size="18" font-family="Arial" fill="#13243a">Polymarket no change</text><rect x="260" y="184" width="380" height="30" fill="#96b6dc"/><rect x="260" y="218" width="376" height="30" fill="#1557aa"/><text x="645" y="207" font-size="18" font-family="Arial">95% · Oct 24</text><text x="645" y="241" font-size="18" font-family="Arial">94% · Oct 27</text><text x="30" y="280" font-size="14" font-family="Arial" fill="#53677f">Bar lengths use 4 px per percentage point; they are not executable quotes.</text></svg>