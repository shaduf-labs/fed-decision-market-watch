<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" role="img" aria-labelledby="title desc"><title id="title">October Fed hold rows reached 84% on both event pages, October 2, 2026</title><desc id="desc">Direct page checks October 1 at 19:03 UTC and October 2 at about 13:40 UTC. Kalshi hold and Polymarket no-change rows rose from 75 to 84 percent; their named 25 basis-point hike rows fell from 25 to 17 percent. Access times are not quote times.</desc><rect width="900" height="365" fill="#f6f9fc"/><style>text{font:16px Arial,sans-serif;fill:#15293e}.title{font-size:23px;font-weight:bold}.small{font-size:13px;fill:#42566c}.label{font-size:16px;font-weight:bold}</style><text x="24" y="39" class="title">October hold rows reach 84% at both venues</text><text x="24" y="65" class="small">Direct named rows · October 1, 19:03 → October 2, about 13:40 UTC</text><text x="24" y="103" class="label">Kalshi · Fed maintains rate</text><rect x="300" y="87" width="375" height="18" fill="#9ac6dd"/><rect x="300" y="111" width="420" height="18" fill="#176d91"/><text x="735" y="126">75% → 84%</text><text x="24" y="165" class="label">Kalshi · Hike 25bps</text><rect x="300" y="149" width="125" height="18" fill="#e6bea1"/><rect x="300" y="173" width="85" height="18" fill="#a4512d"/><text x="735" y="188">25% → 17%</text><text x="24" y="227" class="label">Polymarket · No change</text><rect x="300" y="211" width="375" height="18" fill="#9ac6dd"/><rect x="300" y="235" width="420" height="18" fill="#176d91"/><text x="735" y="250">75% → 84%</text><text x="24" y="289" class="label">Polymarket · 25 bps increase</text><rect x="300" y="273" width="125" height="18" fill="#e6bea1"/><rect x="300" y="297" width="85" height="18" fill="#a4512d"/><text x="735" y="312">25% → 17%</text><text x="24" y="347" class="small">Light: October 1 · dark: October 2. Source: direct Kalshi and Polymarket October event pages.</text></svg>
