<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">October hold rows in three page checks</title><desc id="d">Kalshi maintain: 93 percent October 24 at 19:04 UTC, 93 percent October 27 at 09:43 UTC, 94 percent October 27 at 13:35 UTC. Polymarket no change: 95, 94, and 94 percent at the same checks. Access times are not venue quote times.</desc><rect width="800" height="360" fill="#f5f8fc"/><text x="30" y="38" font-size="23" font-family="Arial" fill="#13243a">October hold: three page checks</text><text x="30" y="63" font-size="14" font-family="Arial" fill="#53677f">Separate venue rows · October 24 and 27, 2026 · access time, not quote time</text><text x="30" y="102" font-size="18" font-family="Arial" fill="#13243a">Kalshi maintain</text><rect x="260" y="82" width="372" height="24" fill="#a5bfdc"/><rect x="260" y="110" width="372" height="24" fill="#6a9acb"/><rect x="260" y="138" width="376" height="24" fill="#1557aa"/><text x="646" y="101" font-size="15" font-family="Arial">93% · Oct 24</text><text x="646" y="129" font-size="15" font-family="Arial">93% · 09:43</text><text x="646" y="157" font-size="15" font-family="Arial">94% · 13:35</text><text x="30" y="218" font-size="18" font-family="Arial" fill="#13243a">Polymarket no change</text><rect x="260" y="198" width="380" height="24" fill="#a5bfdc"/><rect x="260" y="226" width="376" height="24" fill="#6a9acb"/><rect x="260" y="254" width="376" height="24" fill="#1557aa"/><text x="646" y="217" font-size="15" font-family="Arial">95% · Oct 24</text><text x="646" y="245" font-size="15" font-family="Arial">94% · 09:43</text><text x="646" y="273" font-size="15" font-family="Arial">94% · 13:35</text><text x="30" y="322" font-size="14" font-family="Arial" fill="#53677f">Source: Kalshi Chance headings; Polymarket named rows. Bars: 4 px per percentage point.</text></svg>