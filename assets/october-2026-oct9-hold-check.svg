<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" role="img" aria-labelledby="title desc"><title id="title">October hold readings, October 8 evening and October 9 midday</title><desc id="desc">Kalshi maintain-rate Chance heading rose from 83% to 85%. Polymarket No change rose from 84% to 85%. Direct page access times; not quote times.</desc><rect width="760" height="245" fill="#f4f8fc"/><text x="24" y="32" font-family="Arial" font-size="20" font-weight="700" fill="#13243a">October hold readings</text><text x="24" y="54" font-family="Arial" font-size="13" fill="#53677f">Direct event pages · October 8, 19:06 UTC → October 9, 13:33 UTC</text><text x="24" y="93" font-family="Arial" font-size="16" fill="#13243a">Kalshi · maintain rate</text><rect x="260" y="77" width="332" height="20" rx="4" fill="#9ec3e6"/><rect x="260" y="102" width="340" height="20" rx="4" fill="#1557aa"/><text x="610" y="94" font-family="Arial" font-size="16" fill="#13243a">83%</text><text x="610" y="119" font-family="Arial" font-size="16" font-weight="700" fill="#13243a">85%</text><text x="24" y="161" font-family="Arial" font-size="16" fill="#13243a">Polymarket · no change</text><rect x="260" y="145" width="336" height="20" rx="4" fill="#9ec3e6"/><rect x="260" y="170" width="340" height="20" rx="4" fill="#1557aa"/><text x="610" y="162" font-family="Arial" font-size="16" fill="#13243a">84%</text><text x="610" y="187" font-family="Arial" font-size="16" font-weight="700" fill="#13243a">85%</text><text x="24" y="220" font-family="Arial" font-size="13" fill="#53677f">Lighter: Oct 8 · Darker: Oct 9 · Rounded display; do not total across rows.</text></svg>