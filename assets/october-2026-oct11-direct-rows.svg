<svg xmlns="http://www.w3.org/2000/svg" width="920" height="315" viewBox="0 0 920 315" role="img" aria-labelledby="t d"><title id="t">October Fed-decision rows: October 10 and October 11 checks</title><desc id="d">Direct Kalshi Chance headings: maintain rate 85 to 84 percent; hike 25 basis points 15 to 16 percent. Direct Polymarket named rows: no change 84 to 84 percent; 25 basis point increase 16 to 17 percent. October 10 check 19:03 UTC; October 11 check about 21:31 UTC. Page access is not quote time.</desc><rect width="920" height="315" fill="#f4f7fb"/><text x="30" y="42" font-family="Arial" font-size="24" font-weight="700" fill="#10243c">October hold still leads</text><text x="30" y="67" font-family="Arial" font-size="14" fill="#4c6178">Direct event-page checks · Oct 10, 19:03 UTC → Oct 11, about 21:31 UTC</text><text x="555" y="95" font-family="Arial" font-size="14" font-weight="700" fill="#384f69">OCT 10</text><text x="670" y="95" font-family="Arial" font-size="14" font-weight="700" fill="#384f69">OCT 11</text><text x="783" y="95" font-family="Arial" font-size="14" font-weight="700" fill="#384f69">CHANGE</text><line x1="30" y1="107" x2="890" y2="107" stroke="#c8d4e0"/><text x="30" y="132" font-family="Arial" font-size="13" font-weight="700" fill="#1557aa">KALSHI · CHANCE HEADINGS</text><text x="30" y="159" font-family="Arial" font-size="18" fill="#10243c">Fed maintains rate</text><text x="555" y="159" font-family="Arial" font-size="18" fill="#10243c">85%</text><text x="670" y="159" font-family="Arial" font-size="18" font-weight="700" fill="#10243c">84%</text><text x="740" y="159" font-family="Arial" font-size="14" fill="#a54b35">−1 percentage point</text><text x="30" y="187" font-family="Arial" font-size="18" fill="#10243c">Hike 25bps</text><text x="555" y="187" font-family="Arial" font-size="18" fill="#10243c">15%</text><text x="670" y="187" font-family="Arial" font-size="18" font-weight="700" fill="#10243c">16%</text><text x="740" y="187" font-family="Arial" font-size="14" fill="#1d6a49">+1 percentage point</text><line x1="30" y1="198" x2="890" y2="198" stroke="#c8d4e0"/><text x="30" y="223" font-family="Arial" font-size="13" font-weight="700" fill="#1557aa">POLYMARKET · NAMED ROWS</text><text x="30" y="249" font-family="Arial" font-size="18" fill="#10243c">No change</text><text x="555" y="249" font-family="Arial" font-size="18" fill="#10243c">84%</text><text x="670" y="249" font-family="Arial" font-size="18" font-weight="700" fill="#10243c">84%</text><text x="740" y="249" font-family="Arial" font-size="14" fill="#4c6178">unchanged</text><text x="30" y="277" font-family="Arial" font-size="18" fill="#10243c">25 bps increase</text><text x="555" y="277" font-family="Arial" font-size="18" fill="#10243c">16%</text><text x="670" y="277" font-family="Arial" font-size="18" font-weight="700" fill="#10243c">17%</text><text x="740" y="277" font-family="Arial" font-size="14" fill="#1d6a49">+1 percentage point</text><text x="30" y="303" font-family="Arial" font-size="12" fill="#4c6178">Sources: direct Kalshi and Polymarket October pages. Rows are separate, rounded displays; do not total or pool them.</text></svg>