<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-labelledby="title desc"><title id="title">October 2 event-page rows: hold remains ahead at 82 percent</title><desc id="desc">Direct Kalshi and Polymarket October event pages accessed about 13:40 and 19:06 UTC October 2, 2026. Kalshi maintain rate and Polymarket No change fell from 84 to 82 percent. Each named 25 basis-point increase row rose from 17 to 18 percent. Page access times are not quote timestamps.</desc><rect width="940" height="360" fill="#f6f9fc"/><style>text{font:16px Arial,sans-serif;fill:#15293e}.title{font-size:22px;font-weight:bold}.small{font-size:13px;fill:#42566c}.label{font-size:16px;font-weight:bold}</style><text x="24" y="39" class="title">October hold still leads at 82%</text><text x="24" y="65" class="small">Direct named rows · October 2, about 13:40 → about 19:06 UTC</text><text x="24" y="102" class="label">Kalshi · maintains rate</text><rect x="310" y="85" width="420" height="17" fill="#9ac6dd"/><rect x="310" y="108" width="410" height="17" fill="#176d91"/><text x="750" y="123">84% → 82%</text><text x="24" y="163" class="label">Kalshi · Hike 25bps</text><rect x="310" y="146" width="85" height="17" fill="#e6bea1"/><rect x="310" y="169" width="90" height="17" fill="#a4512d"/><text x="750" y="184">17% → 18%</text><text x="24" y="224" class="label">Polymarket · No change</text><rect x="310" y="207" width="420" height="17" fill="#9ac6dd"/><rect x="310" y="230" width="410" height="17" fill="#176d91"/><text x="750" y="245">84% → 82%</text><text x="24" y="285" class="label">Polymarket · 25 bps increase</text><rect x="310" y="268" width="85" height="17" fill="#e6bea1"/><rect x="310" y="291" width="90" height="17" fill="#a4512d"/><text x="750" y="306">17% → 18%</text><text x="24" y="343" class="small">Light: afternoon · dark: evening. Source: direct Kalshi and Polymarket October pages; access is not quote time.</text></svg>
