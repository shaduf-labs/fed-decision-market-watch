<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="title desc"><title id="title">October 2026 Fed decision: named event-contract rows at two page checks</title><desc id="desc">Kalshi maintain rate 84 to 80 percent and hike 25 basis points 16 to 19 percent. Polymarket No change 84 to 80 percent and 25 basis point increase 17 to 20 percent. Page access October 11 at 21:31 UTC and October 12 about 19:11 UTC; not quote times.</desc><rect width="960" height="415" rx="18" fill="#f4f7fb"/><text x="38" y="45" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#13243a">October hold rows fell four points</text><text x="38" y="72" font-family="Arial,sans-serif" font-size="15" fill="#53677f">Direct page access: Oct 11 21:31 UTC → Oct 12 about 19:11 UTC, 2026</text><text x="250" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#53677f">October 11</text><text x="554" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#53677f">October 12</text><g font-family="Arial,sans-serif" font-size="17" fill="#13243a"><text x="38" y="154">Kalshi hold</text><text x="38" y="208">Kalshi hike 25 bp</text><text x="38" y="274">Polymarket no change</text><text x="38" y="328">Polymarket hike 25 bp</text></g><g fill="#9cbedc"><rect x="250" y="133" width="268" height="27" rx="5"/><rect x="250" y="187" width="51" height="27" rx="5"/><rect x="250" y="253" width="268" height="27" rx="5"/><rect x="250" y="307" width="54" height="27" rx="5"/></g><g fill="#1557aa"><rect x="554" y="133" width="256" height="27" rx="5"/><rect x="554" y="187" width="61" height="27" rx="5"/><rect x="554" y="253" width="256" height="27" rx="5"/><rect x="554" y="307" width="64" height="27" rx="5"/></g><g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#13243a"><text x="826" y="154">84 → 80%</text><text x="632" y="208">16 → 19%</text><text x="826" y="274">84 → 80%</text><text x="632" y="328">17 → 20%</text></g><text x="38" y="377" font-family="Arial,sans-serif" font-size="14" fill="#53677f">Source: Kalshi October Chance headings; Polymarket October named rows. Access is not quote time.</text><text x="38" y="398" font-family="Arial,sans-serif" font-size="14" fill="#53677f">Separate rounded venue displays. The intervening path and cause are unknown.</text></svg>
