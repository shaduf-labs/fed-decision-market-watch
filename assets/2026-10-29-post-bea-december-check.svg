<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">December 25-basis-point-hike rows at two page checks</title><desc id="desc">Kalshi 81% on October 28 and 80% on October 29; Polymarket 82% and 78%. Different event contracts, unsynchronized page checks.</desc><rect width="960" height="410" fill="#f5f8fc"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#13243a">December 25-basis-point-hike displays</text><text x="40" y="77" font-family="Arial,sans-serif" font-size="16" fill="#475a70">Named event rows · page access, not quote time</text><text x="40" y="135" font-family="Arial,sans-serif" font-size="18" fill="#13243a">Kalshi Chance heading</text><rect x="300" y="112" width="486" height="32" fill="#6386ad"/><text x="800" y="137" font-family="Arial,sans-serif" font-size="18" fill="#13243a">81% · Oct 28</text><rect x="300" y="155" width="480" height="32" fill="#1557aa"/><text x="800" y="180" font-family="Arial,sans-serif" font-size="18" fill="#13243a">80% · Oct 29</text><text x="40" y="247" font-family="Arial,sans-serif" font-size="18" fill="#13243a">Polymarket named row</text><rect x="300" y="225" width="492" height="32" fill="#6386ad"/><text x="800" y="250" font-family="Arial,sans-serif" font-size="18" fill="#13243a">82% · Oct 28</text><rect x="300" y="268" width="468" height="32" fill="#1557aa"/><text x="800" y="293" font-family="Arial,sans-serif" font-size="18" fill="#13243a">78% · Oct 29</text><text x="40" y="350" font-family="Arial,sans-serif" font-size="15" fill="#475a70">Sources: Kalshi and Polymarket December event pages. Accessed Oct 28 19:05 UTC / Oct 29 13:34 UTC.</text><text x="40" y="377" font-family="Arial,sans-serif" font-size="15" fill="#475a70">Different contract rules and unknown quote times; do not infer causation from the interval.</text></svg>