<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 760 280"><title id="t">October 19, 2026: two page checks of named event-market rows</title><desc id="d">Kalshi Chance headings: maintain 86 to 86 percent, hike 13 to 14 percent. Polymarket named rows: no change 86 to 85 percent, increase 14 to 15 percent. Accessed at 13:33 and about 19:07 UTC; not quote times.</desc><rect width="760" height="280" fill="#f3f7fb"/><text x="24" y="34" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#13243a">October 19: hold still leads</text><text x="24" y="58" font-family="Arial,sans-serif" font-size="13" fill="#465b72">Direct page checks · 13:33 UTC → about 19:07 UTC · not venue quote times</text><g font-family="Arial,sans-serif" font-size="14" fill="#13243a"><text x="24" y="96">Kalshi · maintain rate</text><text x="24" y="139">Kalshi · hike 25 bp</text><text x="24" y="182">Polymarket · no change</text><text x="24" y="225">Polymarket · increase 25 bp</text></g><g fill="#b6c9dc"><rect x="248" y="82" width="344" height="13" rx="3"/><rect x="248" y="125" width="52" height="13" rx="3"/><rect x="248" y="168" width="344" height="13" rx="3"/><rect x="248" y="211" width="56" height="13" rx="3"/></g><g fill="#1557aa"><rect x="248" y="98" width="344" height="13" rx="3"/><rect x="248" y="141" width="56" height="13" rx="3"/><rect x="248" y="184" width="340" height="13" rx="3"/><rect x="248" y="227" width="60" height="13" rx="3"/></g><g font-family="Arial,sans-serif" font-size="13" fill="#13243a"><text x="610" y="106">86 → 86%</text><text x="610" y="149">13 → 14%</text><text x="610" y="192">86 → 85%</text><text x="610" y="235">14 → 15%</text></g><text x="24" y="265" font-family="Arial,sans-serif" font-size="12" fill="#465b72">Gray = 13:33 UTC; blue = about 19:07 UTC. Sources: Kalshi and Polymarket, October 19, 2026.</text></svg>