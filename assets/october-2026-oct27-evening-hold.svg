<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 305" role="img" aria-labelledby="title desc"><title id="title">October hold rows at two October 27 page checks</title><desc id="desc">Kalshi maintain Chance heading 94% at 13:35 and 19:02 UTC. Polymarket no-change named row 94% at 13:35 and 95% at 19:02 UTC. Page access is not venue quote time.</desc><rect width="800" height="305" fill="#f5f8fc"/><text x="26" y="38" font-family="Arial" font-size="23" fill="#13243a">October hold: two page checks</text><text x="26" y="62" font-family="Arial" font-size="14" fill="#53677f">October 27, 2026 · separate contract displays · access time, not quote time</text><text x="26" y="100" font-family="Arial" font-size="18" fill="#13243a">Kalshi maintain</text><rect x="255" y="82" width="376" height="22" fill="#9fb9d4"/><rect x="255" y="108" width="376" height="22" fill="#1557aa"/><text x="645" y="99" font-family="Arial" font-size="15">94% · 13:35</text><text x="645" y="125" font-family="Arial" font-size="15">94% · 19:02</text><text x="26" y="183" font-family="Arial" font-size="18" fill="#13243a">Polymarket no change</text><rect x="255" y="165" width="376" height="22" fill="#9fb9d4"/><rect x="255" y="191" width="380" height="22" fill="#1557aa"/><text x="645" y="182" font-family="Arial" font-size="15">94% · 13:35</text><text x="645" y="208" font-family="Arial" font-size="15">95% · 19:02</text><text x="26" y="260" font-family="Arial" font-size="14" fill="#53677f">Sources: Kalshi Chance headings; Polymarket named outcome rows.</text><text x="26" y="282" font-family="Arial" font-size="14" fill="#53677f">Bars use 4 px per percentage point; the page does not show venue quote time.</text></svg>