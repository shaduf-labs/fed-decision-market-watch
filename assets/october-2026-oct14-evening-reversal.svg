<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d"><title id="t">October 14 contract checks: hold returns to lead</title><desc id="d">Kalshi hold 53 to 69 percent and hike 47 to 31 percent; Polymarket no change 47 to 69 percent and 25 basis point increase 52 to 31 percent. Access about 13:34 and 19:04 UTC, separate venues.</desc><rect width="780" height="330" fill="#f5f8fc"/><text x="24" y="34" font-family="Arial" font-size="22" font-weight="700" fill="#13243a">October 14: two page checks</text><text x="24" y="58" font-family="Arial" font-size="13" fill="#41556d">Named rows, percent · earlier 13:34 UTC (light), evening 19:04 UTC (dark)</text><text x="24" y="92" font-family="Arial" font-size="15" fill="#13243a">Kalshi · maintain</text><rect x="245" y="78" width="212" height="16" rx="3" fill="#a9c2dc"/><rect x="245" y="96" width="276" height="16" rx="3" fill="#1557aa"/><text x="467" y="92" font-family="Arial" font-size="13" fill="#13243a">53%</text><text x="531" y="110" font-family="Arial" font-size="13" fill="#13243a">69%</text><text x="24" y="150" font-family="Arial" font-size="15" fill="#13243a">Kalshi · hike 25 bp</text><rect x="245" y="136" width="188" height="16" rx="3" fill="#a9c2dc"/><rect x="245" y="154" width="124" height="16" rx="3" fill="#1557aa"/><text x="443" y="150" font-family="Arial" font-size="13" fill="#13243a">47%</text><text x="379" y="168" font-family="Arial" font-size="13" fill="#13243a">31%</text><text x="24" y="208" font-family="Arial" font-size="15" fill="#13243a">Polymarket · no change</text><rect x="245" y="194" width="188" height="16" rx="3" fill="#a9c2dc"/><rect x="245" y="212" width="276" height="16" rx="3" fill="#1557aa"/><text x="443" y="208" font-family="Arial" font-size="13" fill="#13243a">47%</text><text x="531" y="226" font-family="Arial" font-size="13" fill="#13243a">69%</text><text x="24" y="266" font-family="Arial" font-size="15" fill="#13243a">Polymarket · 25 bp increase</text><rect x="245" y="252" width="208" height="16" rx="3" fill="#a9c2dc"/><rect x="245" y="270" width="124" height="16" rx="3" fill="#1557aa"/><text x="463" y="266" font-family="Arial" font-size="13" fill="#13243a">52%</text><text x="379" y="284" font-family="Arial" font-size="13" fill="#13243a">31%</text><text x="24" y="318" font-family="Arial" font-size="12" fill="#41556d">Source: Kalshi Chance headings and Polymarket named rows; accessed October 14, 2026. Access is not quote time.</text></svg>