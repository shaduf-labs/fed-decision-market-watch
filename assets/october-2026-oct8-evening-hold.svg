<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">October hold rows at two direct checks on October 8</title><desc id="desc">Kalshi maintain-rate Chance heading was 82% at 13:35 UTC and 83% at 19:06 UTC. Polymarket No change was 84% at both checks. Page access is not quote time.</desc><rect width="760" height="280" fill="#f6f9fc"/><text x="24" y="34" fill="#13243a" font-family="Arial" font-size="20" font-weight="700">October hold rows · October 8, 2026</text><text x="24" y="58" fill="#53677f" font-family="Arial" font-size="13">Direct page checks, not quote times</text><text x="24" y="103" fill="#13243a" font-family="Arial" font-size="16">Kalshi · Chance heading</text><rect x="230" y="83" width="410" height="22" fill="#d9e7f6"/><rect x="230" y="83" width="340" height="22" fill="#1557aa"/><text x="650" y="101" fill="#13243a" font-family="Arial" font-size="15">82% → 83%</text><text x="24" y="157" fill="#13243a" font-family="Arial" font-size="16">Polymarket · named row</text><rect x="230" y="137" width="410" height="22" fill="#d9e7f6"/><rect x="230" y="137" width="344" height="22" fill="#16856a"/><text x="650" y="155" fill="#13243a" font-family="Arial" font-size="15">84% → 84%</text><text x="24" y="214" fill="#53677f" font-family="Arial" font-size="13">13:35 UTC → 19:06 UTC · separate rounded event-contract displays</text><text x="24" y="237" fill="#53677f" font-family="Arial" font-size="13">Sources: Kalshi and Polymarket October event pages, accessed October 8, 2026</text></svg>