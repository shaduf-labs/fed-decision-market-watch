<title id="title">October Fed-decision contract readings, September 27, 2026</title><desc id="desc">At pool access 13:35 UTC on September 27, Kalshi Chance headings showed 64 percent Hike 25bps and 35 percent Fed maintains rate. Polymarket rows showed 65 percent 25 bps increase and 34 percent No change. Sources: direct Kalshi and Polymarket October event pages. These are separate venue-specific readings, not a consensus.</desc>
<rect width="1080" height="450" fill="#f4f8fe"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#13243a">October decision-market observations</text><text x="54" y="90" font-family="Arial,sans-serif" font-size="17" fill="#53677f">Separate venue rows · accessed September 27, 2026 at 13:35 UTC</text>
<rect x="54" y="124" width="470" height="232" rx="16" fill="#fff" stroke="#dce5ef"/><text x="82" y="164" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#13243a">Kalshi · Chance headings</text><rect x="82" y="194" width="282" height="34" rx="7" fill="#c46345"/><text x="82" y="254" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">64% · Hike 25bps</text><rect x="82" y="274" width="154" height="34" rx="7" fill="#7587a0"/><text x="82" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">35% · Fed maintains rate</text><text x="82" y="385" font-family="Arial,sans-serif" font-size="16" fill="#53677f">Hike unchanged; maintain rate down 1 point.</text>
<rect x="556" y="124" width="470" height="232" rx="16" fill="#fff" stroke="#dce5ef"/><text x="584" y="164" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#13243a">Polymarket · named rows</text><rect x="584" y="194" width="286" height="34" rx="7" fill="#1557aa"/><text x="584" y="254" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">65% · 25 bps increase</text><rect x="584" y="274" width="150" height="34" rx="7" fill="#7587a0"/><text x="584" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">34% · No change</text><text x="584" y="385" font-family="Arial,sans-serif" font-size="16" fill="#53677f">Both rows matched last direct verification.</text>
