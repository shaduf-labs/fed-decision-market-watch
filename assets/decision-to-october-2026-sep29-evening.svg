<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc"><title id="title">October hold overtakes 25 bp hike on two event pages</title><desc id="desc">Source pages accessed September 29, 2026 at 13:35 and 19:02 UTC. Kalshi hold 30 to 52 percent and hike 70 to 46 percent. Polymarket no change 31 to 51 percent and 25 basis point increase 69 to 48 percent.</desc><rect width="920" height="350" fill="#f4f7fb"/><text x="35" y="42" font-family="Arial" font-size="24" fill="#13243a">October event-page readings flipped toward hold</text><text x="35" y="69" font-family="Arial" font-size="14" fill="#53677f">September 29, 2026 · page access at 13:35 and 19:02 UTC · not quote timestamps</text><text x="35" y="109" font-family="Arial" font-size="18" fill="#13243a">Kalshi</text><text x="35" y="140" font-family="Arial" font-size="15">13:35</text><rect x="130" y="122" width="300" height="26" fill="#2261a7"/><text x="445" y="141" font-family="Arial" font-size="15">Hike 70%</text><rect x="550" y="122" width="129" height="26" fill="#a96a22"/><text x="690" y="141" font-family="Arial" font-size="15">Hold 30%</text><text x="35" y="174" font-family="Arial" font-size="15">19:02</text><rect x="130" y="156" width="197" height="26" fill="#2261a7"/><text x="340" y="175" font-family="Arial" font-size="15">Hike 46%</text><rect x="550" y="156" width="223" height="26" fill="#a96a22"/><text x="785" y="175" font-family="Arial" font-size="15">Hold 52%</text><text x="35" y="224" font-family="Arial" font-size="18" fill="#13243a">Polymarket</text><text x="35" y="255" font-family="Arial" font-size="15">13:35</text><rect x="130" y="237" width="296" height="26" fill="#2261a7"/><text x="440" y="256" font-family="Arial" font-size="15">Hike 69%</text><rect x="550" y="237" width="133" height="26" fill="#a96a22"/><text x="694" y="256" font-family="Arial" font-size="15">No change 31%</text><text x="35" y="289" font-family="Arial" font-size="15">19:02</text><rect x="130" y="271" width="206" height="26" fill="#2261a7"/><text x="349" y="290" font-family="Arial" font-size="15">Hike 48%</text><rect x="550" y="271" width="219" height="26" fill="#a96a22"/><text x="781" y="290" font-family="Arial" font-size="15">No change 51%</text><text x="35" y="332" font-family="Arial" font-size="12" fill="#53677f">Sources: direct Kalshi and Polymarket October event pages. Bars scale each named row independently; not a complete distribution.</text></svg>