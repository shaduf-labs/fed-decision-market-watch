<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">October hold rows in two page checks</title><desc id="d">Kalshi Chance heading fell from 89% on October 21 at 13:36 UTC to 88% at 19:05 UTC. Polymarket named no-change row fell from 88% to 87%. Page access times are not venue quote times.</desc><rect width="760" height="300" fill="#f6f9fc"/><text x="28" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#142b43">Hold remains the leading outcome</text><text x="28" y="64" font-family="Arial" font-size="14" fill="#53677f">Named page rows · not executable prices or quote times</text><text x="28" y="105" font-family="Arial" font-size="17" fill="#142b43">Kalshi · maintains rate</text><rect x="245" y="86" width="356" height="16" rx="3" fill="#c7d9ed"/><rect x="245" y="109" width="352" height="16" rx="3" fill="#1762a6"/><text x="618" y="101" font-family="Arial" font-size="16" fill="#142b43">89%</text><text x="618" y="124" font-family="Arial" font-size="16" font-weight="700" fill="#142b43">88%</text><text x="28" y="177" font-family="Arial" font-size="17" fill="#142b43">Polymarket · no change</text><rect x="245" y="158" width="352" height="16" rx="3" fill="#c7d9ed"/><rect x="245" y="181" width="348" height="16" rx="3" fill="#1762a6"/><text x="618" y="173" font-family="Arial" font-size="16" fill="#142b43">88%</text><text x="618" y="196" font-family="Arial" font-size="16" font-weight="700" fill="#142b43">87%</text><rect x="28" y="234" width="15" height="15" fill="#c7d9ed"/><text x="50" y="247" font-family="Arial" font-size="13" fill="#334d67">Oct 21 · 13:36 UTC</text><rect x="230" y="234" width="15" height="15" fill="#1762a6"/><text x="252" y="247" font-family="Arial" font-size="13" fill="#334d67">Oct 21 · 19:05 UTC</text><text x="28" y="278" font-family="Arial" font-size="12" fill="#53677f">Sources: Kalshi October event; Polymarket October event. Accessed on date shown.</text></svg>
