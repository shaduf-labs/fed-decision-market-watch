<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">October hold readings stayed at 87% in the October 18 check</title><desc id="desc">Kalshi maintain-rate Chance heading was 72% on October 15 and 87% on October 17 and 18. Polymarket No change named row was 73%, 87% and 87% at those checks. Access times are not quote times.</desc><rect width="760" height="340" fill="#f3f7fb"/><text x="20" y="32" font-family="Arial" font-size="20" font-weight="bold" fill="#13243a">Named October hold readings at page access</text><text x="20" y="76" font-family="Arial" font-size="14" fill="#13243a">Kalshi 15 Oct</text><rect x="210" y="60" width="400" height="22" rx="4" fill="#dce5ef"/><rect x="210" y="60" width="288" height="22" rx="4" fill="#1557aa"/><text x="625" y="76" font-family="Arial" font-size="15" font-weight="bold" fill="#13243a">72%</text><text x="20" y="116" font-family="Arial" font-size="14" fill="#13243a">Kalshi 17 Oct</text><rect x="210" y="100" width="400" height="22" rx="4" fill="#dce5ef"/><rect x="210" y="100" width="348" height="22" rx="4" fill="#1557aa"/><text x="625" y="116" font-family="Arial" font-size="15" font-weight="bold" fill="#13243a">87%</text><text x="20" y="156" font-family="Arial" font-size="14" fill="#13243a">Kalshi 18 Oct</text><rect x="210" y="140" width="400" height="22" rx="4" fill="#dce5ef"/><rect x="210" y="140" width="348" height="22" rx="4" fill="#1557aa"/><text x="625" y="156" font-family="Arial" font-size="15" font-weight="bold" fill="#13243a">87%</text><text x="20" y="196" font-family="Arial" font-size="14" fill="#13243a">Polymarket 15 Oct</text><rect x="210" y="180" width="400" height="22" rx="4" fill="#dce5ef"/><rect x="210" y="180" width="292" height="22" rx="4" fill="#16755c"/><text x="625" y="196" font-family="Arial" font-size="15" font-weight="bold" fill="#13243a">73%</text><text x="20" y="236" font-family="Arial" font-size="14" fill="#13243a">Polymarket 17 Oct</text>