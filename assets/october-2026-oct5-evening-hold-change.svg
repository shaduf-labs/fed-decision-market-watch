<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-labelledby="title desc"><title id="title">October 5 hold readings fell four points on both event pages</title><desc id="desc">Kalshi October maintain-rate Chance heading fell from 82% at October 5, 13:37 UTC page access to 78% at 19:08 UTC. Polymarket No change fell from 83% to 79% across the same checks. Access is not quote time.</desc><rect width="820" height="340" rx="14" fill="#f4f7fb"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13243a">October 5: named hold rows down four points</text><text x="30" y="72" font-family="Arial,sans-serif" font-size="15" fill="#53677f">Direct page access · UTC · access is not quote time</text><text x="30" y="115" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#13243a">Kalshi · Fed maintains rate</text><text x="30" y="159" font-family="Arial,sans-serif" font-size="14" fill="#53677f">13:37</text><rect x="105" y="143" width="492" height="21" fill="#80a8da"/><text x="607" y="160" font-family="Arial,sans-serif" font-size="15" fill="#13243a">82%</text><text x="30" y="190" font-family="Arial,sans-serif" font-size="14" fill="#53677f">19:08</text><rect x="105" y="174" width="468" height="21" fill="#1557aa"/><text x="583" y="191" font-family="Arial,sans-serif" font-size="15" fill="#13243a">78%</text><text x="30" y="230" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#13243a">Polymarket · No change</text><text x="30" y="274" font-family="Arial,sans-serif" font-size="14" fill="#53677f">13:37</text><rect x="105" y="258" width="498" height="21" fill="#83bca8"/><text x="613" y="275" font-family="Arial,sans-serif" font-size="15" fill="#13243a">83%</text><text x="30" y="305" font-family="Arial,sans-serif" font-size="14" fill="#53677f">19:08</text><rect x="105" y="289" width="474" height="21" fill="#18785b"/><text x="589" y="306" font-family="Arial,sans-serif" font-size="15" fill="#13243a">79%</text></svg>