<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc"><title id="title">October Fed-decision contract rows, September 28, 2026</title><desc id="desc">At pool access 13:33 UTC September 28, Kalshi Chance headings showed 67 percent Hike 25bps and 32 percent Fed maintains rate. Polymarket rows showed 66 percent 25 bps increase and 33 percent No change. Separate venues; no combined forecast.</desc><rect width="1080" height="480" fill="#f4f8fe"/><text x="48" y="55" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#13243a">October decision-contract rows</text><text x="48" y="87" font-family="Arial,sans-serif" font-size="17" fill="#53677f">Direct event pages · accessed September 28, 2026 at 13:33 UTC</text><rect x="48" y="120" width="477" height="286" rx="14" fill="#fff" stroke="#dce5ef"/><rect x="555" y="120" width="477" height="286" rx="14" fill="#fff" stroke="#dce5ef"/><text x="76" y="158" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13243a">Kalshi · Chance headings</text><text x="583" y="158" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13243a">Polymarket · outcome rows</text><text x="76" y="199" font-family="Arial,sans-serif" font-size="17" fill="#13243a">Hike 25bps</text><rect x="76" y="210" width="300" height="25" rx="4" fill="#e8edf4"/><rect x="76" y="210" width="201" height="25" rx="4" fill="#c46345"/><text x="390" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13243a">67%</text><text x="76" y="280" font-family="Arial,sans-serif" font-size="17" fill="#13243a">Fed maintains rate</text><rect x="76" y="291" width="300" height="25" rx="4" fill="#e8edf4"/><rect x="76" y="291" width="96" height="25" rx="4" fill="#7587a0"/><text x="390" y="312" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13243a">32%</text><text x="76" y="371" font-family="Arial,sans-serif" font-size="