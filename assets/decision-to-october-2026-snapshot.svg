<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Polymarket's October hike row is 68 percent; Kalshi's named hike row is 66 percent</title>
  <desc id="desc">At pool access time 19:04 UTC on September 23, 2026, Kalshi displayed 66 percent for a 25-basis-point hike and 32 percent for maintain rate. Polymarket displayed 68 percent for a 25-basis-point increase and 33 percent for no change. Source: direct Kalshi and Polymarket October event pages.</desc>
