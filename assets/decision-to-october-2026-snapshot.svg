<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">October Fed-decision event-contract rows at two recorded pool access times</title><desc id="desc">Kalshi's named 25-basis-point hike row moved from 63 percent at 13:35 UTC on September 24 to 65 percent at 19:06 UTC, while its maintain-rate row remained 35 percent. Polymarket's named 25-basis-point increase row moved from 64 to 66 percent, while its no-change row moved from 36 to 34 percent. Source: direct Kalshi and Polymarket October event pages. The readings are separate venue-specific contracts.</desc><rect width="1200" height="620" fill="#f5f8fc"/><text x="60" y="66" fill="#13243a" font-family="Arial, sans-serif" font-size="30" font-weight="700">October decision rows: named hike leads widened in the evening check</text><text x="60" y="98" fill="#53677f" font-family="Arial, sans-serif" font-size="18">Recorded pool access times: Sep. 24, 13:35 UTC and Sep. 24, 19:06 UTC</text><line x1="60" y1="305" x2="1140" y2="305" stroke="#b6c5d5" stroke-width="2"/><line x1="60" y1="545" x2="1140" y2="545" stroke="#b6c5d5" stroke-width="2"/><text x="60" y="145" fill="#13243a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Kalshi · direct event page</text><text x="60" y="365" fill="#13243a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Polymarket · direct event contract</text><text x="60" y="184" fill="#53677f" font-family="Arial, sans-serif" font-size="17">Hike 25bps</text><rect x="250" y="164" width="504" height="28" rx="6" fill="#9bbadd"/><rect x="250" y="202" width="520" height="28" rx="6" fill="#1557aa"/><text x="768" y="185" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">63% · 13:35</text><text x="784" y="223" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">65% · 19:06</text><text x="60" y="263" fill="#53677f" font-family="Arial, sans-serif" font-size="17">Maintain rate</text><rect x="250" y="243" width="280" height="28" rx="6" fill="#c8d7e8"/><rect x="250" y="281" width="280" height="28" rx="6" fill="#4f739b"/><text x="544" y="264" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">35% · 13:35</text><text x="544" y="302" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">35% · 19:06</text><text x="60" y="404" fill="#53677f" font-family="Arial, sans-serif" font-size="17">25 bp increase</text><rect x="250" y="384" width="512" height="28" rx="6" fill="#9bbadd"/><rect x="250" y="422" width="528" height="28" rx="6" fill="#1557aa"/><text x="776" y="405" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">64% · 13:35</text><text x="792" y="443" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">66% · 19:06</text><text x="60" y="483" fill="#53677f" font-family="Arial, sans-serif" font-size="17">No change</text><rect x="250" y="463" width="288" height="28" rx="6" fill="#c8d7e8"/><rect x="250" y="501" width="272" height="28" rx="6" fill="#4f739b"/><text x="552" y="484" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">36% · 13:35</text><text x="536" y="522" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">34% · 19:06</text><text x="60" y="590" fill="#53677f" font-family="Arial, sans-serif" font-size="15">Source: direct Kalshi and Polymarket October pages, accessed Sep. 24, 2026. Not a consensus or futures-implied measure.</text></svg>
