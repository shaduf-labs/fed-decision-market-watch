<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">October Fed-decision event-contract rows at two recorded pool access times</title><desc id="desc">Kalshi's named Chance headings changed from 67 percent Hike 25bps and 33 percent Fed maintains rate at 13:33 UTC to 29 percent Hike 25bps and 69 percent Fed maintains rate at 19:06 UTC on September 25, 2026. Polymarket's named 25-basis-point increase row changed from 67 to 63 percent and no change from 33 to 37 percent. Source: direct Kalshi and Polymarket October event pages. The readings are separate venue-specific contracts.</desc><rect width="1200" height="650" fill="#f5f8fc"/><text x="60" y="66" fill="#13243a" font-family="Arial, sans-serif" font-size="30" font-weight="700">October decision rows: Kalshi names a hold; Polymarket names a hike</text><text x="60" y="98" fill="#53677f" font-family="Arial, sans-serif" font-size="18">Recorded pool access times: Sep. 25, 13:33 UTC and 19:06 UTC</text><line x1="60" y1="325" x2="1140" y2="325" stroke="#b6c5d5" stroke-width="2"/><line x1="60" y1="565" x2="1140" y2="565" stroke="#b6c5d5" stroke-width="2"/><text x="60" y="145" fill="#13243a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Kalshi · named Chance headings</text><text x="60" y="385" fill="#13243a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Polymarket · direct event contract</text><text x="60" y="184" fill="#53677f" font-family="Arial, sans-serif" font-size="17">Hike 25bps</text><rect x="250" y="164" width="536" height="28" rx="6" fill="#9bbadd"/><rect x="250" y="202" width="232" height="28" rx="6" fill="#c46345"/><text x="800" y="185" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">67% · 13:33</text><text x="496" y="223" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">29% · 19:06</text><text x="60" y="263" fill="#53677f" font-family="Arial, sans-serif" font-size="17">Fed maintains rate</text><rect x="250" y="243" width="264" height="28" rx="6" fill="#c8d7e8"/><rect x="250" y="281" width="552" height="28" rx="6" fill="#1557aa"/><text x="528" y="264" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">33% · 13:33</text><text x="816" y="302" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">69% · 19:06</text><text x="60" y="424" fill="#53677f" font-family="Arial, sans-serif" font-size="17">25 bp increase</text><rect x="250" y="404" width="536" height="28" rx="6" fill="#9bbadd"/><rect x="250" y="442" width="504" height="28" rx="6" fill="#1557aa"/><text x="800" y="425" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">67% · 13:33</text><text x="768" y="463" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">63% · 19:06</text><text x="60" y="503" fill="#53677f" font-family="Arial, sans-serif" font-size="17">No change</text><rect x="250" y="483" width="264" height="28" rx="6" fill="#c8d7e8"/><rect x="250" y="521" width="296" height="28" rx="6" fill="#4f739b"/><text x="528" y="504" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">33% · 13:33</text><text x="560" y="542" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">37% · 19:06</text><text x="60" y="610" fill="#53677f" font-family="Arial, sans-serif" font-size="15">Source: direct Kalshi and Polymarket October pages, accessed Sep. 25, 2026. Not a consensus or futures-implied measure.</text><text x="60" y="632" fill="#53677f" font-family="Arial, sans-serif" font-size="13">Kalshi chart uses the page's named Chance headings; its separate displayed Yes price differed on the hike row.</text></svg>
