<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Polymarket's October hike row leads at 54 percent; Kalshi's named hike row is 51 percent</title>
  <desc id="desc">At pool access time 13:37 UTC on September 23, 2026, Kalshi displayed 51 percent for a 25-basis-point hike and 47 percent for maintain rate. Polymarket displayed 54 percent for a 25-basis-point increase and 46 percent for no change. Source: direct Kalshi and Polymarket October event pages.</desc>
  <rect width="1080" height="520" fill="#f5f8fc"/><text x="54" y="62" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#13243a">October decision rows: named 25 bp-hike leads hold</text>
  <text x="54" y="94" font-family="Arial, sans-serif" font-size="17" fill="#53677f">Direct event pages accessed September 23, 2026, 13:37 UTC · separate venue-specific contracts</text>
  <text x="54" y="132" font-family="Arial, sans-serif" font-size="15" fill="#53677f">Since September 22, 19:05 UTC: Kalshi named rows −1 point; Polymarket hike +1, no change unchanged</text>
  <g font-family="Arial, sans-serif" fill="#13243a"><text x="54" y="194" font-size="21" font-weight="700">Kalshi</text><text x="54" y="225" font-size="16">Hike 25bps</text><text x="54" y="310" font-size="16">Maintain rate</text><text x="54" y="395" font-size="14" fill="#53677f">Hike &gt;25bps: 1% · two outcomes hidden</text></g>
  <rect x="255" y="194" width="714" height="45" rx="8" fill="#c46345"/><rect x="255" y="279" width="658" height="45" rx="8" fill="#1759a6"/>
  <text x="983" y="225" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#13243a">51%</text><text x="927" y="310" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#13243a">47%</text>
  <g font-family="Arial, sans-serif" fill="#13243a"><text x="54" y="453" font-size="21" font-weight="700">Polymarket</text><text x="360" y="453" font-size="16">25 bp increase</text><text x="696" y="453" font-size="16">No change</text></g>
  <rect x="360" y="421" width="259" height="17" rx="5" fill="#c46345"/><rect x="696" y="421" width="221" height="17" rx="5" fill="#1759a6"/>
