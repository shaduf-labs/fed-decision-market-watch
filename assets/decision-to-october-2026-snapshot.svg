<svg xmlns="http://www.w3.org/2000/svg" width="920" height="468" viewBox="0 0 920 468" role="img" aria-labelledby="title desc">
  <title id="title">September decision and October event-contract snapshot</title>
  <desc id="desc">The Federal Reserve raised the target range by 25 basis points to 3.75 to 4 percent on September 16, 2026. Direct October event pages accessed at 19:06 UTC on September 18 showed Kalshi at 56 percent for a 25 basis point hike and 43 percent for maintain rate, and Polymarket at 55 percent for a 25 basis point increase and 44 percent for no change. The event contracts are separate measures, not a consensus.</desc>
  <rect width="920" height="468" rx="18" fill="#10233d"/>
  <text x="44" y="48" fill="#f5f8ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">The named 25 bp-hike lead widened on direct October pages.</text>
  <text x="44" y="75" fill="#aec0d7" font-family="Arial, sans-serif" font-size="15">Sources: Federal Reserve statement Sep. 16, 2026, 14:00 EDT · venue pages accessed Sep. 18, 19:06 UTC</text>
  <rect x="44" y="100" width="832" height="75" rx="12" fill="#224968"/>
  <text x="68" y="130" fill="#dceeff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Official September decision · FOMC statement</text>
  <text x="68" y="157" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">+25 bp · target range 3.75%–4.00% · 12–0 vote</text>
  <text x="44" y="214" fill="#dceeff" font-family="Arial, sans-serif" font-size="18" font-weight="700">October named event-contract rows (each bar is separate; not a full distribution)</text>
  <text x="44" y="246" fill="#dceeff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Kalshi · direct October page</text>
  <text x="44" y="271" fill="#dceeff" font-family="Arial, sans-serif" font-size="14">Hike 25 bp</text><rect x="168" y="256" width="336" height="26" rx="6" fill="#c46345"/><text x="518" y="275" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">56%</text>
  <text x="44" y="307" fill="#dceeff" font-family="Arial, sans-serif" font-size="14">Maintain rate</text><rect x="168" y="292" width="258" height="26" rx="6" fill="#507ab7"/><text x="440" y="311" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">43%</text>
  <text x="44" y="350" fill="#dceeff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Polymarket · direct October page</text>
  <text x="44" y="375" fill="#dceeff" font-family="Arial, sans-serif" font-size="14">Hike 25 bp</text><rect x="168" y="360" width="330" height="26" rx="6" fill="#c46345"/><text x="512" y="379" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">55%</text>
  <text x="44" y="411" fill="#dceeff" font-family="Arial, sans-serif" font-size="14">No change</text><rect x="168" y="396" width="264" height="26" rx="6" fill="#507ab7"/><text x="446" y="415" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">44%</text>
  <text x="44" y="450" fill="#efbf68" font-family="Arial, sans-serif" font-size="13">Kalshi hides additional outcomes; Polymarket shows rounded rows. Do not add, average, or trade on this chart.</text>
</svg>
