<title id="title">October Fed-decision observations on September 26, 2026</title>
<desc id="desc">Kalshi at 19:03 UTC showed 64 percent Hike 25bps and 36 percent Fed maintains rate, unchanged from 13:37 UTC. Polymarket’s last directly verified observation at 13:37 UTC showed 65 percent 25 bp increase and 34 percent no change; its 19:03 UTC direct page showed a U.S. location gate.</desc>
<rect width="1080" height="450" fill="#f4f8fe"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#13243a">October decision-market observations</text><text x="54" y="90" font-family="Arial,sans-serif" font-size="17" fill="#53677f">Separate venue-specific rows. Access time is not a quote timestamp.</text>
<rect x="54" y="124" width="470" height="232" rx="16" fill="#fff" stroke="#dce5ef"/><text x="82" y="164" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#13243a">Kalshi · accessed 19:03 UTC</text><rect x="82" y="194" width="282" height="34" rx="7" fill="#c46345"/><text x="82" y="254" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">64% · Hike 25bps</text><rect x="82" y="274" width="159" height="34" rx="7" fill="#7587a0"/><text x="82" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">36% · Fed maintains rate</text><text x="82" y="385" font-family="Arial,sans-serif" font-size="16" fill="#53677f">Named headings matched the 13:37 UTC access.</text>
<rect x="556" y="124" width="470" height="232" rx="16" fill="#fff" stroke="#dce5ef"/><text x="584" y="164" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#13243a">Polymarket · last verified 13:37 UTC</text><rect x="584" y="194" width="286" height="34" rx="7" fill="#1557aa"/><text x="584" y="254" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">65% · 25 bp increase</text><rect x="584" y="274" width="150" height="34" rx="7" fill="#7587a0"/><text x="584" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#13243a">34% · No change</text><text x="584" y="385" font-family="Arial,sans-serif" font-size="16" fill="#53677f">At 19:03 UTC, page showed a U.S. location gate.</text>
