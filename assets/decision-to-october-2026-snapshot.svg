<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Polymarket's October hike row leads; Kalshi's named hike row is 52 percent</title>
  <desc id="desc">At pool access time 19:05 UTC on September 22, 2026, Kalshi displayed 52 percent for a 25-basis-point hike and 48 percent for maintain rate. Polymarket displayed 53 percent for a 25-basis-point increase and 46 percent for no change. Source: direct Kalshi and Polymarket October event pages.</desc>
  <rect width="1080" height="500" fill="#f5f8fc"/><text x="54" y="62" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#13243a">October decision rows: Polymarket hike lead; Kalshi at 52%</text>
  <text x="54" y="94" font-family="Arial, sans-serif" font-size="17" fill="#53677f">Direct event pages accessed September 22, 2026, 19:05 UTC · separate venue-specific contracts</text>
  <line x1="250" y1="418" x2="1010" y2="418" stroke="#7b8da3" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#13243a"><text x="70" y="198" font-size="21" font-weight="700">Kalshi</text><text x="70" y="229" font-size="16">Hike 25bps</text><text x="70" y="315" font-size="16">Maintain rate</text><text x="70" y="392" font-size="14" fill="#53677f">Two outcomes hidden</text></g>
  <rect x="250" y="197" width="728" height="45" rx="8" fill="#c46345"/><rect x="250" y="283" width="672" height="45" rx="8" fill="#1759a6"/>
  <text x="992" y="228" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#13243a">52%</text><text x="936" y="314" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#13243a">48%</text>
  <g font-family="Arial, sans-serif" fill="#13243a"><text x="70" y="462" font-size="21" font-weight="700">Polymarket</text><text x="350" y="462" font-size="16">25 bp increase</text><text x="678" y="462" font-size="16">No change</text></g>
  <rect x="350" y="430" width="249" height="17" rx="5" fill="#c46345"/><rect x="678" y="430" width="216" height="17" rx="5" fill="#1759a6"/>
  <text x="607" y="445" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#13243a">53%</text><text x="902" y="445" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#13243a">46%</text>
  <text x="54" y="486" font-family="Arial, sans-serif" font-size="13" fill="#53677f">Source and observation date: direct Kalshi and Polymarket October event pages, accessed September 22, 2026. Not a consensus or futures-implied estimate.</text>
</svg>
