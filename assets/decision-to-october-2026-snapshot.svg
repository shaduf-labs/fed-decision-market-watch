<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">October Fed-decision event-contract rows at two recorded pool access times</title><desc id="desc">Kalshi's named 25-basis-point hike row moved from 66 percent on September 23 at 19:04 UTC to 63 percent on September 24 at 13:35 UTC, while its maintain-rate row moved from 32 to 35 percent. Polymarket's named 25-basis-point increase row moved from 68 to 64 percent, while its no-change row moved from 33 to 36 percent. Source: direct Kalshi and Polymarket October event pages. The readings are separate venue-specific contracts.</desc><rect width="1200" height="620" fill="#f5f8fc"/><text x="60" y="66" fill="#13243a" font-family="Arial, sans-serif" font-size="30" font-weight="700">October decision rows: named hike leads narrowed, but remained first</text><text x="60" y="98" fill="#53677f" font-family="Arial, sans-serif" font-size="18">Recorded pool access times: Sep. 23, 19:04 UTC and Sep. 24, 13:35 UTC</text><line x1="60" y1="305" x2="1140" y2="305" stroke="#b6c5d5" stroke-width="2"/><line x1="60" y1="545" x2="1140" y2="545" stroke="#b6c5d5" stroke-width="2"/><text x="60" y="145" fill="#13243a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Kalshi · direct event page</text><text x="60" y="365" fill="#13243a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Polymarket · direct event contract</text><text x="60" y="184" fill="#53677f" font-family="Arial, sans-serif" font-size="17">Hike 25bps</text><rect x="250" y="164" width="528" height="28" rx="6" fill="#9bbadd"/><rect x="250" y="202" width="504" height="28" rx="6" fill="#1557aa"/><text x="792" y="185" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">66% · Sep. 23</text><text x="768" y="223" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">63% · Sep. 24</text><text x="60" y="263" fill="#53677f" font-family="Arial, sans-serif" font-size="17">Maintain rate</text><rect x="250" y="243" width="256" height="28" rx="6" fill="#c8d7e8"/><rect x="250" y="281" width="280" height="28" rx="6" fill="#4f739b"/><text x="520" y="264" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">32% · Sep. 23</text><text x="544" y="302" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">35% · Sep. 24</text><text x="60" y="404" fill="#53677f" font-family="Arial, sans-serif" font-size="17">25 bp increase</text><rect x="250" y="384" width="544" height="28" rx="6" fill="#9bbadd"/><rect x="250" y="422" width="512" height="28" rx="6" fill="#1557aa"/><text x="808" y="405" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">68% · Sep. 23</text><text x="776" y="443" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">64% · Sep. 24</text><text x="60" y="483" fill="#53677f" font-family="Arial, sans-serif" font-size="17">No change</text><rect x="250" y="463" width="264" height="28" rx="6" fill="#c8d7e8"/><rect x="250" y="501" width="288" height="28" rx="6" fill="#4f739b"/><text x="528" y="484" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">33% · Sep. 23</text><text x="552" y="522" fill="#13243a" font-family="Arial, sans-serif" font-size="18" font-weight="700">36% · Sep. 24</text><text x="60" y="590" fill="#53677f" font-family="Arial, sans-serif" font-size="15">Source: direct Kalshi and Polymarket October pages, accessed Sep. 24, 2026. Not a consensus or futures-implied measure.</text></svg>
