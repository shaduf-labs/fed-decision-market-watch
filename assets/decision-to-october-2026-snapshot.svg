<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">October 2026 Fed-decision event-contract snapshot</title><desc id="desc">At pool access time 19:08 UTC on September 20, 2026, Kalshi displayed 56 percent for a 25-basis-point hike, 45 percent for maintain rate, and 1 percent for a hike over 25 basis points. Polymarket displayed 56 percent for a 25-basis-point increase and 44 percent for no change. Direct venue-specific readings, not a consensus.</desc><rect width="960" height="410" fill="#f4f8fe"/><text x="56" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#13243a">October decision: direct event-page snapshot</text><text x="56" y="88" font-family="Arial, sans-serif" font-size="16" fill="#53677f">Pool access: September 20, 2026 · 19:08 UTC · not a pooled forecast</text><rect x="56" y="124" width="405" height="212" rx="16" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/><text x="84" y="163" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#13243a">Kalshi October</text><text x="84" y="197" font-family="Arial, sans-serif" font-size="16" fill="#53677f">Direct event-series headings</text><rect x="84" y="218" width="336" height="31" rx="8" fill="#c46345"/><text x="96" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Hike 25bps · 56%</text><rect x="84" y="260" width="270" height="31" rx="8" fill="#7f9fc0"/><text x="96" y="282" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Maintain rate · 45%</text><text x="84" y="317" font-family="Arial, sans-serif" font-size="14" fill="#53677f">Hike &gt;25bps: 1% · two outcomes hidden</text><rect x="499" y="124" width="405" height="212" rx="16" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/><text x="527" y="163" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#13243a">Polymarket October</text><text x="527" y="197" font-family="Arial, sans-serif" font-size="16" fill="#53677f">Direct multi-outcome contract</text><rect x="527" y="218" width="336" height="31" rx="8" fill="#c46345"/><text x="539" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">25 bp increase · 56%</text><rect x="527" y="260" width="264" height="31" rx="8" fill="#7f9fc0"/><text x="539" y="282" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">No change · 44%</text><text x="527" y="317" font-family="Arial, sans-serif" font-size="14" fill="#53677f">Smaller rows shown separately; may be rounded</text><text x="56" y="376" font-family="Arial, sans-serif" font-size="14" fill="#53677f">Sources: direct Kalshi and Polymarket October pages. Neither page supplied a separate reliable quote time.</text></svg>
