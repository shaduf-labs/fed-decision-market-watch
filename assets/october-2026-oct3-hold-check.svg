<svg xmlns="http://www.w3.org/2000/svg" width="760" height="235" viewBox="0 0 760 235" role="img" aria-labelledby="t d"><title id="t">October hold rows: small changes, different venues</title><desc id="d">Kalshi maintain-rate Chance heading 82% on October 2 at about 19:06 UTC and 81% on October 3 at 13:34 UTC. Polymarket No change named row 82% then 83%. Direct source pages accessed at those times; not quote times.</desc><rect width="760" height="235" fill="#f4f8fc"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#13243a">Hold remains the named leader</text><text x="24" y="57" font-family="Arial,sans-serif" font-size="13" fill="#52677d">Direct event-page checks · October 2, ~19:06 UTC → October 3, 13:34 UTC</text><text x="24" y="100" font-family="Arial,sans-serif" font-size="17" fill="#13243a">Kalshi · maintains rate</text><text x="295" y="100" font-family="Arial,sans-serif" font-size="19" fill="#4d6980">82%</text><text x="355" y="100" font-family="Arial,sans-serif" font-size="20" fill="#4d6980">→</text><text x="414" y="100" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#1557aa">81%</text><text x="502" y="100" font-family="Arial,sans-serif" font-size="16" fill="#13243a">−1 point</text><line x1="24" y1="118" x2="736" y2="118" stroke="#d5e1eb"/><text x="24" y="156" font-family="Arial,sans-serif" font-size="17" fill="#13243a">Polymarket · no change</text><text x="295" y="156" font-family="Arial,sans-serif" font-size="19" fill="#4d6980">82%</text><text x="355" y="156" font-family="Arial,sans-serif" font-size="20" fill="#4d6980">→</text><text x="414" y="156" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#1557aa">83%</text><text x="502" y="156" font-family="Arial,sans-serif" font-size="16" fill="#13243a">+1 point</text><text x="24" y="200" font-family="Arial,sans-serif" font-size="12" fill="#52677d">Sources: Kalshi October Chance heading; Polymarket October named row. Page access is not quote time.</text><text x="24" y="219" font-family="Arial,sans-serif" font-size="12" fill="#52677d">Do not average the venues or infer a complete probability distribution from rounded rows.</text></svg>
