<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-labelledby="t d"><title id="t">October hold readings, two page checks</title><desc id="d">Kalshi maintain-rate Chance heading: 86 percent October 19 and 87 percent October 20. Polymarket no-change named row: 85 percent October 19 and 87 percent October 20. Page access, not quote time.</desc><rect width="780" height="270" fill="#f3f7fb"/><text x="24" y="38" fill="#13243a" font-size="21" font-family="Arial">Hold remains the leading named outcome</text><text x="24" y="63" fill="#52657c" font-size="14" font-family="Arial">Direct page checks · Oct 19 19:07 UTC → Oct 20 13:35 UTC</text><text x="24" y="108" fill="#13243a" font-size="17" font-family="Arial">Kalshi · Chance heading</text><rect x="260" y="86" width="430" height="27" fill="#b8cbe4"/><rect x="260" y="118" width="435" height="27" fill="#1557aa"/><text x="704" y="106" fill="#13243a" font-size="16" font-family="Arial">86%</text><text x="704" y="139" fill="#13243a" font-size="16" font-family="Arial">87%</text><text x="24" y="191" fill="#13243a" font-size="17" font-family="Arial">Polymarket · named row</text><rect x="260" y="169" width="425" height="27" fill="#b8cbe4"/><rect x="260" y="201" width="435" height="27" fill="#1557aa"/><text x="704" y="190" fill="#13243a" font-size="16" font-family="Arial">85%</text><text x="704" y="222" fill="#13243a" font-size="16" font-family="Arial">87%</text><text x="24" y="253" fill="#52657c" font-size="13" font-family="Arial">Light: Oct 19 · dark: Oct 20 · independently rounded displays</text></svg>